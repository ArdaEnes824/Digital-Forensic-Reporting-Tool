<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DFIR · Chain of Custody</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/site.css" rel="stylesheet" />
</head>
<body>
    <div id="page-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex align-items-center gap-2">
                <span class="text-muted-dfir">Vaka:</span>
                <select id="case-select" class="form-select" style="width:auto;min-width:280px"></select>
            </div>
            <button class="btn btn-cyber" data-perm="custody:write" data-bs-toggle="modal" data-bs-target="#cocModal">+ Transfer Ekle</button>
        </div>

        <div class="panel">
            <table class="table-dfir">
                <thead>
                    <tr><th>Tarih</th><th>Kimden</th><th>Kime</th><th>Konum</th><th>Açıklama</th><th></th></tr>
                </thead>
                <tbody id="coc-body">
                    <tr><td colspan="6" class="text-muted-dfir">Vaka seçin.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="cocModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="coc-form">
                    <div class="modal-header">
                        <h5 class="modal-title">Zincir Transferi</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-6">
                                <label class="form-label text-muted-dfir">Kimden</label>
                                <input id="coc-from" class="form-control mb-3" required />
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted-dfir">Kime</label>
                                <input id="coc-to" class="form-control mb-3" required />
                            </div>
                        </div>
                        <label class="form-label text-muted-dfir">Tarih</label>
                        <input id="coc-date" type="datetime-local" class="form-control mb-3" />

                        <label class="form-label text-muted-dfir">Konum</label>
                        <input id="coc-location" class="form-control mb-3" />

                        <label class="form-label text-muted-dfir">Açıklama</label>
                        <textarea id="coc-desc" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">İptal</button>
                        <button type="submit" class="btn btn-cyber">Kaydet</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        if (!requireAuth()) throw new Error("redirecting");
        renderShell("Chain of Custody");
        applyPermissions();

        const canWrite = Api.store.can("custody:write");
        const modal = new bootstrap.Modal(document.getElementById("cocModal"));
        const caseSelect = document.getElementById("case-select");

        async function init() {
            try {
                const cases = await Api.cases.all();
                if (!cases.length) {
                    caseSelect.innerHTML = `<option>Vaka yok</option>`;
                    return;
                }
                caseSelect.innerHTML = cases.map(c =>
                    `<option value="${c.id}">${escapeHtml(c.caseNumber)} — ${escapeHtml(c.title)}</option>`).join("");
                caseSelect.addEventListener("change", load);
                load();
            } catch (err) {
                showError(err.message || "Vakalar yüklenemedi.");
            }
        }

        async function load() {
            const caseId = caseSelect.value;
            if (!caseId) return;
            try {
                const records = await Api.custody.byCase(caseId);
                const body = document.getElementById("coc-body");
                if (!records.length) {
                    body.innerHTML = `<tr><td colspan="6" class="text-muted-dfir">Bu vaka için transfer kaydı yok.</td></tr>`;
                    return;
                }
                body.innerHTML = records.map(r => `
                    <tr>
                        <td>${fmtDate(r.transferDate)}</td>
                        <td>${escapeHtml(r.fromPerson)}</td>
                        <td>${escapeHtml(r.toPerson)}</td>
                        <td>${escapeHtml(r.location)}</td>
                        <td>${escapeHtml(r.description)}</td>
                        <td class="text-end">
                            ${canWrite ? `<button class="btn btn-ghost btn-sm" onclick='removeCustody(${r.id})'>Sil</button>` : ""}
                        </td>
                    </tr>`).join("");
            } catch (err) {
                showError(err.message || "Kayıtlar yüklenemedi.");
            }
        }

        window.removeCustody = async (id) => {
            if (!confirm("Bu transfer kaydı silinsin mi?")) return;
            try { await Api.custody.remove(id); load(); }
            catch (err) { showError(err.message || "Silinemedi."); }
        };

        document.getElementById("coc-form").addEventListener("submit", async e => {
            e.preventDefault();
            const dateVal = document.getElementById("coc-date").value;
            const dto = {
                caseId: parseInt(caseSelect.value, 10),
                fromPerson: document.getElementById("coc-from").value.trim(),
                toPerson: document.getElementById("coc-to").value.trim(),
                transferDate: dateVal ? new Date(dateVal).toISOString() : new Date().toISOString(),
                location: document.getElementById("coc-location").value.trim(),
                description: document.getElementById("coc-desc").value.trim()
            };
            try {
                await Api.custody.create(dto);
                modal.hide();
                document.getElementById("coc-form").reset();
                load();
            } catch (err) {
                showError(err.message || "Kaydedilemedi.");
            }
        });

        init();
    </script>
</body>
</html>
