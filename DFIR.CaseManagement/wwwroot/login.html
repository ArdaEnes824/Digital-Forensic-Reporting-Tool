<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DFIR · Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/site.css" rel="stylesheet" />
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="text-center mb-4">
                <div class="brand">DFIR<span style="color:var(--accent)">.</span></div>
                <div class="brand-sub">Digital Forensics &amp; Incident Response</div>
            </div>

            <form id="login-form">
                <div id="login-error" class="alert-dfir mb-3" style="display:none;padding:10px 14px;border-radius:10px"></div>

                <label class="form-label text-muted-dfir">Kullanıcı Adı</label>
                <input id="username" class="form-control mb-3" autocomplete="username" required />

                <label class="form-label text-muted-dfir">Parola</label>
                <input id="password" type="password" class="form-control mb-4" autocomplete="current-password" required />

                <button class="btn btn-cyber w-100 py-2" type="submit" id="login-btn">Giriş Yap</button>
            </form>

        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        if (Api.store.access) location.replace("dashboard.html");

        const form = document.getElementById("login-form");
        const errorBox = document.getElementById("login-error");
        const btn = document.getElementById("login-btn");

        form.addEventListener("submit", async e => {
            e.preventDefault();
            errorBox.style.display = "none";
            btn.disabled = true;
            btn.textContent = "Giriş yapılıyor...";
            try {
                await Api.auth.login(
                    document.getElementById("username").value.trim(),
                    document.getElementById("password").value
                );
                location.href = "dashboard.html";
            } catch (err) {
                errorBox.textContent = err.status === 401
                    ? "Kullanıcı adı veya parola hatalı."
                    : (err.message || "Giriş başarısız.");
                errorBox.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.textContent = "Giriş Yap";
            }
        });
    </script>
</body>
</html>
