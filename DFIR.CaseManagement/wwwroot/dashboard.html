<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DFIR · Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/site.css" rel="stylesheet" />
</head>
<body>
    <div id="page-content">
        <div class="row g-3 mb-4" id="stat-cards"></div>

        <div class="row g-3">
            <div class="col-lg-6">
                <div class="panel h-100">
                    <div class="stat-label mb-3">Vaka Durumu</div>
                    <canvas id="caseStatusChart" height="180"></canvas>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="panel h-100">
                    <div class="stat-label mb-3">Malware Risk Analizi</div>
                    <canvas id="riskChart" height="180"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        if (!requireAuth()) throw new Error("redirecting");
        renderShell("Dashboard");

        const STAT_DEFS = [
            { key: "totalCases", label: "Toplam Vaka", cls: "" },
            { key: "openCases", label: "Açık Vaka", cls: "accent" },
            { key: "closedCases", label: "Kapalı Vaka", cls: "" },
            { key: "totalEvidence", label: "Delil Sayısı", cls: "" },
            { key: "highRiskMalware", label: "Yüksek Riskli Analiz", cls: "danger" }
        ];

        (async () => {
            try {
                const data = await Api.dashboard.summary();
                renderStats(data);
                renderCharts(data);
            } catch (err) {
                showError(err.message || "Özet yüklenemedi.");
            }
        })();

        function renderStats(data) {
            document.getElementById("stat-cards").innerHTML = STAT_DEFS.map(d => `
                <div class="col-6 col-lg">
                    <div class="stat-card">
                        <div class="stat-label">${d.label}</div>
                        <div class="stat-value ${d.cls}">${data[d.key] ?? 0}</div>
                    </div>
                </div>`).join("");
        }

        function renderCharts(data) {
            Chart.defaults.color = "#7d8aa3";
            Chart.defaults.borderColor = "#1f2a3d";

            const inProgress = Math.max(data.totalCases - data.openCases - data.closedCases, 0);
            new Chart(document.getElementById("caseStatusChart"), {
                type: "doughnut",
                data: {
                    labels: ["Açık", "Devam Eden", "Kapalı"],
                    datasets: [{
                        data: [data.openCases, inProgress, data.closedCases],
                        backgroundColor: ["#2bd1ff", "#ffb454", "#7d8aa3"],
                        borderWidth: 0
                    }]
                },
                options: { plugins: { legend: { position: "bottom" } } }
            });

            const safe = Math.max(data.totalMalwareAnalyses - data.highRiskMalware, 0);
            new Chart(document.getElementById("riskChart"), {
                type: "bar",
                data: {
                    labels: ["Yüksek Riskli", "Diğer"],
                    datasets: [{
                        label: "Analiz",
                        data: [data.highRiskMalware, safe],
                        backgroundColor: ["#ff5d6c", "#00e5a8"],
                        borderRadius: 6
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });
        }
    </script>
</body>
</html>
